accessLogging: false
debugLogging: true
devices:
  sub1:
    type: minidsp
    exe: minidsp
    options: '--tcp 127.0.0.1:5333'
    cmdTimeout: 10
  sub2:
    type: minidsp
    exe: minidsp
    options: '--tcp 127.0.0.1:5334'
    cmdTimeout: 10
  sub3:
    type: minidsp
    exe: minidsp
    options: '--tcp 127.0.0.1:5335'
    cmdTimeout: 10
  bass_array:
    type: composite
    mode: mirror
    members:
    - sub1
    - sub2
    - sub3
  rear_sub:
    type: minidsp
    exe: minidsp
    options: '--tcp 127.0.0.1:5336'
    cmdTimeout: 10
  side_sub:
    type: minidsp
    exe: minidsp
    options: '--tcp 127.0.0.1:5337'
    device_type: 4x10
    cmdTimeout: 10
  rear_subs:
    type: composite
    mode: mapped
    primary: rear_sub
    exposeMembers: true
    allowPartialGain: true
    members:
      rear_sub: {}
      side_sub:
        slotMap:
          '1': '3'
          '2': '4'
        channelMap:
          '1': '3'
        skipOps:
        - set_gain
        mvAdjust: -1.5
port: 8080
