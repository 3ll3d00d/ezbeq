[project]
name = "ezbeq"
version = "2.11.5"
description = "A webapp which can send beqcatalogue filters to a DSP device"
authors = [
    { name = "3ll3d00d", email = "mattkhan+ezbeq@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11, <3.16"
dependencies = [
    "Flask-Compress >=1.13, <2.0",
    "PyYAML >=6.0, <7.0",
    "plumbum >=1.8.1, <3.0",
    "Twisted >=24.3.0, <27.0",
    "requests >=2.30.0, <3.0",
    "python-dateutil >=2.8.2, <3.0",
    "autobahn[twisted] >=24.4.2, <27.0",
    "semver >=3.0.0, <4.0",
    "flask-restx >=1.3.0, <2.0",
    "prometheus-client >=0.17.1, <1.0",
    "ijson >=3.2.3, <4.0",
    "psutil >=5.9.5, <8.0"
]

[project.urls]
Homepage = "https://ezbeq.readthedocs.io/"
Repository = "https://github.com/3ll3d00d/ezbeq"

[project.scripts]
ezbeq = 'ezbeq.main:main'

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.2.0",
    "pytest-httpserver>=1.0.7,<1.2.0",
    "pytest-cov ~=7.1.0",
    "busypie ~=0.6.1",
    "pyupgrade ~=3.21.2",
    "ruff >=0.15.5, <0.17.0",
    "ty >=0.0.32, <0.1.0",
]
docs = [
    "mkdocs>=1.4.3,<1.7.0",
    "mkdocs-material>=9.1.13,<9.8.0",
    "mkdocs-material-extensions>=1.1.1,<1.4.0",
]
exe = [
    "pyinstaller ~=6.22.0; python_version >= '3.11' and python_version < '3.16'",
]

[tool.pytest.ini_options]
markers = [
    "integration: starts a real Twisted server subprocess (slower)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# ezbeq/ui (built frontend) and ezbeq/VERSION are generated at release/build
# time and are gitignored, so they must be force-included here or hatchling's
# default VCS-based exclusion will drop them from sdists and wheels.
artifacts = [
    "ezbeq/ui/**/*",
    "ezbeq/VERSION",
]

[tool.hatch.build.targets.wheel]
include = [
    "ezbeq/**",
]
