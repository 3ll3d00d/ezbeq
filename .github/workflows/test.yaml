name: run tests
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    branches:
      - '**'
defaults:
  run:
    shell: bash
jobs:
  detect-version-bump:
    uses: ./.github/workflows/detect-version-bump.yaml
  detect-changed-paths:
    uses: ./.github/workflows/detect-changed-paths.yaml
  build:
    needs: [detect-version-bump, detect-changed-paths]
    if: needs.detect-version-bump.outputs.skip != 'true' && needs.detect-changed-paths.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        experimental: [false]
        include:
          - python-version: '3.15.0-beta.4'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked
      - name: pytest
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run pytest --cov=./ezbeq --cov-report=xml
      - name: smoke test
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: bin/smoke-test
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [detect-version-bump, detect-changed-paths, build]
    if: always()
    # statuses:read lets the coverage-gate step below poll Codecov's commit status via the API.
    permissions:
      statuses: read
    steps:
      - name: Check build result
        # Check the gating jobs' own result before trusting their outputs - if either crashed
        # outright (e.g. a dorny/paths-filter hiccup), its output is empty, which "!= 'true'"
        # would otherwise misreport as a legitimate skip instead of the CI infra failure it is.
        run: |
          if [[ "${{ needs.detect-version-bump.result }}" != "success" ]]; then
            echo "detect-version-bump job did not succeed: ${{ needs.detect-version-bump.result }}"
            exit 1
          fi
          if [[ "${{ needs.detect-changed-paths.result }}" != "success" ]]; then
            echo "detect-changed-paths job did not succeed: ${{ needs.detect-changed-paths.result }}"
            exit 1
          fi
          if [[ "${{ needs.detect-version-bump.outputs.skip }}" == "true" ]]; then
            echo "Skipping: version-only bump commit"
            exit 0
          fi
          if [[ "${{ needs.detect-changed-paths.outputs.python }}" != "true" ]]; then
            echo "Skipping: no python-relevant changes"
            exit 0
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "build job did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
      - name: Wait for Codecov coverage-regression result
        # Only reached when python-relevant paths changed and build succeeded (the checks above
        # already exited 0/1 for every other case) - so unlike the raw `codecov/project/python`
        # status context (which was required directly in branch protection and simply never posts
        # for a commit that never uploads, permanently blocking merge - see AGENTS.md's "Before
        # pushing" item on wrapper jobs for the identical problem with build/test-run), this step
        # only ever waits when an upload was actually expected. Coarse heartbeat poll bounded by a
        # timeout, same pattern as the "waiting for PR checks" guidance in AGENTS.md.
        if: needs.detect-version-bump.outputs.skip != 'true' && needs.detect-changed-paths.outputs.python == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          context="codecov/project/python"
          deadline=$((SECONDS + 900))
          state=""
          while (( SECONDS < deadline )); do
            state=$(gh api "repos/${{ github.repository }}/commits/${sha}/status" \
              --jq ".statuses[] | select(.context==\"${context}\") | .state" 2>/dev/null | head -1)
            echo "t+${SECONDS}s: ${context} = ${state:-<not posted yet>}"
            case "$state" in
              success) break ;;
              error|failure) echo "Codecov reported '${state}' for ${context}"; exit 1 ;;
            esac
            sleep 30
          done
          if [[ "$state" != "success" ]]; then
            echo "Timed out after 900s waiting for ${context} - Codecov never reported a result"
            exit 1
          fi
