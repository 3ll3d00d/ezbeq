name: create apps
on:
  push:
    tags:
      - '*'
  # TEMPORARY - lets buildmobileios be run on demand while it's still being verified, without
  # triggering a real release (every other job below is gated to `push` only, so a manual run
  # touches nothing but the iOS build). Remove this trigger, and the `if: github.event_name ==
  # 'push'` guards on create_release/buildmobileandroid below, once a manual run has confirmed the
  # iOS job works end-to-end - see mobile/docs/ios-ci-automation-plan.md's "Validation before
  # merging" section.
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  create_release:
    name: Create Release
    # TEMPORARY - see the workflow_dispatch comment above. Without this, a manual test run of
    # buildmobileios would also cut a real (pre)release and publish to PyPI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked
      - name: pytest
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run pytest --cov=./ezbeq --cov-report=xml
      - name: smoke test
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: bin/smoke-test
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Setup node_modules
        working-directory: ./ui
        run: yarn install --immutable
      - name: UI unit tests
        working-directory: ./ui
        run: yarn test:unit --run
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.7.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine release type
        id: release_type
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          make_latest: ${{ steps.release_type.outputs.prerelease == 'false' }}
  buildpypi:
    name: Publish to Pypi
    needs: create_release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/ezbeq
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Setup node_modules
        working-directory: ./ui
        run: yarn install --immutable
      - name: Build UI
        working-directory: ./ui
        run: yarn build
      - name: Get latest release version number
        id: get_version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set version
        run: |
          echo ${{ steps.get_version.outputs.version-without-v }} > ezbeq/VERSION
      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Build dist
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv build
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/dispatches
          owner: 3ll3d00d
          repo: ezbeq-docker
          event_type: 'trigger'
        env:
          GITHUB_TOKEN: ${{ secrets.EZBEQJR }}
  buildpyinstaller:
    name: Publish to Github
    needs: create_release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Setup node_modules
        working-directory: ./ui
        run: yarn install --frozen-lockfile
      - name: Build UI
        working-directory: ./ui
        run: yarn build
      - name: Get latest release version number
        id: get_version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set version
        run: |
          echo ${{ steps.get_version.outputs.version-without-v }} > ezbeq/VERSION
      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --group exe
      - name: Create distribution
        id: create_dist
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv run pyinstaller --clean --log-level=INFO ezbeq.spec
          if [[ "$RUNNER_OS" == "macOS" ]]
          then
            pushd dist
            rm ezbeq
            zip -r ezbeq.app.zip ezbeq.app
            rm -Rf ezbeq.app
            popd
            echo "binary_path=dist/ezbeq.app.zip" >> $GITHUB_OUTPUT
            echo "binary_name=ezbeq.app.zip" >> $GITHUB_OUTPUT
            echo "binary_content_type=application.zip" >> $GITHUB_OUTPUT
          elif [[ "$RUNNER_OS" == "Windows" ]]
          then
            echo "binary_path=dist/ezbeq.exe" >> $GITHUB_OUTPUT
            echo "binary_name=ezbeq.exe" >> $GITHUB_OUTPUT
            echo "binary_content_type=application.vnd.microsoft.portable-executable" >> $GITHUB_OUTPUT
          fi
      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            gh release upload ${{ github.ref_name }} ${{ steps.create_dist.outputs.binary_path }}
  buildmobileandroid:
    name: Build Android APK
    # Deliberately no `needs: create_release` - nothing in this job depends on the release
    # existing (only the final upload does, see publishmobileandroid below), and create_release's
    # pytest/UI-test/changelog steps take ~2.5 minutes that were previously serialized in front of
    # this ~15+ minute build for no reason.
    #
    # TEMPORARY - see the workflow_dispatch comment at the top of the file. Without this guard, a
    # manual test run of buildmobileios would also rebuild the Android APK for no reason (harmless,
    # just wasted runner time - buildmobileandroid has no `needs`, so it isn't skipped by
    # create_release skipping the way publishmobileandroid downstream of it is).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v7
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      # JDK 24+ triggers a Gradle bug (a JEP 472 "restricted method" warning misreported as a
      # build failure in the CMake-configure task native modules like react-native-worklets/
      # react-native-screens use - see https://github.com/gradle/gradle/issues/31625, still open)
      # - React Native's own docs recommend JDK 17. See mobile/README.md's "Dev client build"
      # section for the same requirement/fix on a local machine.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Persists ~/.gradle/caches (downloaded dependencies + the --build-cache task-output cache
      # below) and the wrapper distribution across runs, keyed on the wrapper/gradle files that
      # `expo prebuild` generates. This job's own ref (a release tag) is never reused, so it can
      # only ever populate its own scope's cache, never restore it - the entry that actually gets
      # restored here comes from warm-mobile-android-cache.yaml, which runs the same build on every
      # push to main and saves under that scope, which tag builds *can* fall back to. Using the
      # dedicated action rather than actions/setup-java's own `cache: gradle` input deliberately -
      # the two caching mechanisms can conflict if both are enabled (see
      # https://github.com/actions/setup-java/issues/588), and this one manages cache entries more
      # precisely (per-dependency, with cleanup of stale/unused entries) than the coarser one built
      # into setup-java.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Get release version number
        id: get_version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set app version from tag
        run: |
          jq --arg v "${{ steps.get_version.outputs.version-without-v }}" '.expo.version = $v' app.json > app.json.tmp
          mv app.json.tmp app.json
      # expo-dev-client (and its own transitive expo-dev-launcher/expo-dev-menu/
      # expo-dev-menu-interface deps) is a regular dependency because `expo run:android` needs it
      # for local dev-client builds, but it has no purpose in a signed release APK. Autolinking
      # normally links it into every build regardless of variant, accounting for ~180 of this
      # build's ~850 Gradle tasks. CI-only exclusion (never committed) via the
      # `expo.autolinking.android.exclude` package.json option expo-modules-autolinking's Gradle
      # task reads directly at build time - see
      # node_modules/expo-modules-autolinking/build/commands/autolinkingOptions.js.
      - name: Exclude dev-client-only modules from the release build
        run: |
          jq '.expo.autolinking.android.exclude = ["expo-dev-client", "expo-dev-launcher", "expo-dev-menu", "expo-dev-menu-interface"]' package.json > package.json.tmp
          mv package.json.tmp package.json
      - name: Prebuild native Android project
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean
      # Decoded straight into android/app/ so the bare filename below (matching the debug
      # keystore's own `file('debug.keystore')` convention in the Expo template) resolves
      # correctly - Gradle's file() resolves relative to the module (android/app/) that declares
      # it, not the repo root. See mobile/plugins/withAndroidReleaseSigning.js for the config
      # plugin that wires these MOBILE_RELEASE_* properties into a release signingConfig - without
      # them set, that plugin falls back to the debug keystore instead (what every local
      # `expo run:android --variant release` uses, keeping local dev builds working with no setup).
      - name: Decode release keystore
        run: echo "${{ secrets.MOBILE_RELEASE_STORE_BASE64 }}" | base64 -d > android/app/ezbeq-mobile-release.keystore
      - name: Build signed release APK
        working-directory: ./mobile/android
        # x86/x86_64 dropped from the release build - they're only relevant to Android emulators
        # and long-obsolete Intel-based devices, essentially unused by anyone installing this APK
        # on a real phone/tablet, and each extra ABI roughly multiplies every native module's
        # compile step (Reanimated, Screens' Fabric bits, etc.) across the board. Local dev builds
        # (`expo run:android`) still build all 4, so an emulator remains usable for development.
        #
        # --no-daemon: this job invokes Gradle exactly once, so there's no second build in the same
        # job to amortize a persistent daemon's warm-JVM/warm-classloader benefit against - the
        # daemon here was pure overhead (a few extra seconds of startup bookkeeping, plus it was
        # observed running out of JVM Metaspace mid-build and having to restart, per the "Daemon
        # will expire..." warning in build logs). --no-daemon runs the build directly in the
        # already-running gradlew process instead.
        # --parallel: the prebuilt project has ~40 subprojects (one per native module) and ~850
        # tasks; without --parallel Gradle executes them one project at a time despite most being
        # mutually independent, wasting the runner's other CPU cores.
        # GRADLE_OPTS raises the build JVM's heap/metaspace ceiling to give --parallel's extra
        # concurrent task/classloader memory pressure headroom (the default 2048m/512m was already
        # tight running serially) - set via GRADLE_OPTS rather than a gradle.properties
        # org.gradle.jvmargs entry because that setting only configures the *daemon's* fork args and
        # has no effect once --no-daemon skips spawning one.
        env:
          GRADLE_OPTS: -Xmx4096m -XX:MaxMetaspaceSize=1024m
        run: |
          ./gradlew app:assembleRelease --no-daemon --parallel --configure-on-demand --build-cache \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -PMOBILE_RELEASE_STORE_FILE=ezbeq-mobile-release.keystore \
            -PMOBILE_RELEASE_STORE_PASSWORD="${{ secrets.MOBILE_RELEASE_STORE_PASSWORD }}" \
            -PMOBILE_RELEASE_KEY_ALIAS="${{ secrets.MOBILE_RELEASE_KEY_ALIAS }}" \
            -PMOBILE_RELEASE_KEY_PASSWORD="${{ secrets.MOBILE_RELEASE_KEY_PASSWORD }}"
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ezbeq-mobile-android.apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  publishmobileandroid:
    name: Publish Android APK
    needs: [create_release, buildmobileandroid]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download APK build artifact
        uses: actions/download-artifact@v4
        with:
          name: ezbeq-mobile-android.apk
      # --repo is required here (unlike the other Upload asset steps in this workflow) because this
      # job has no actions/checkout step - gh normally resolves the target repo from the local git
      # remote, which doesn't exist without one.
      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} app-release.apk#ezbeq-mobile-android.apk --repo ${{ github.repository }}

  buildmobileios:
    name: Build iOS app
    # Deliberately no `needs: create_release`, same reasoning as buildmobileandroid - nothing in
    # this job depends on the release existing.
    #
    # No Apple account or credentials anywhere in this job/its secrets - it archives with code
    # signing disabled entirely (CODE_SIGNING_ALLOWED=NO below), which iOS permits since signing is
    # only enforced at install/launch time, not at build time. The resulting artifacts are
    # unsigned; end users sign them locally with their own free Apple ID - see
    # mobile/docs/ios-sideloading.md for that half of the workflow and
    # mobile/docs/ios-ci-automation-plan.md for why this job is built this way.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v7
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Get release version number
        id: get_version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set app version from tag
        run: |
          jq --arg v "${{ steps.get_version.outputs.version-without-v }}" '.expo.version = $v' app.json > app.json.tmp
          mv app.json.tmp app.json
      # expo-dev-client (and its expo-dev-launcher/expo-dev-menu/expo-dev-menu-interface deps) is a
      # regular dependency because `expo run:ios` needs it for local dev-client builds, but it has
      # no purpose in a build meant to be signed and run standalone - same reasoning as the Android
      # job's equivalent step. expo-modules-autolinking's iOS platform is internally named "apple"
      # (node_modules/expo-modules-autolinking/scripts/ios/autolinking_manager.rb always passes
      # `--platform apple`), which falls back to reading an "ios" key from package.json when no
      # "apple" key is present (parsePackageJsonOptions in node_modules/expo-modules-autolinking/
      # src/commands/autolinkingOptions.ts) - so "ios" here (mirroring the Android job's "android"
      # key) does take effect, just via that fallback rather than being the primary key.
      - name: Exclude dev-client-only modules from the release build
        run: |
          jq '.expo.autolinking.ios.exclude = ["expo-dev-client", "expo-dev-launcher", "expo-dev-menu", "expo-dev-menu-interface"]' package.json > package.json.tmp
          mv package.json.tmp package.json
      - name: Prebuild native iOS project
        env:
          CI: 1
        run: npx expo prebuild --platform ios --clean
      # expo-notifications' config plugin unconditionally writes an aps-environment entitlement
      # (node_modules/expo-notifications/plugin/build/withNotificationsIOS.js) even though this app
      # only ever uses local notifications (see the Expo Go warning in mobile/README.md's "Running
      # locally" section) - free-tier Personal Team signing doesn't support the Push Notifications
      # capability, so leaving this entitlement in would risk local re-signing (Sideloadly/AltStore/
      # Xcode) failing or silently dropping it. Confirmed by running `expo prebuild` locally: this
      # is the only entitlements file Expo generates for this app.
      - name: Strip the unused push-notifications entitlement
        run: /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$(find ios -name '*.entitlements')"
      - name: Discover the generated Xcode workspace and scheme
        id: xcode_project
        working-directory: ./mobile/ios
        run: |
          workspace=$(ls *.xcworkspace)
          scheme=$(xcodebuild -workspace "$workspace" -list -json | jq -r '.workspace.schemes | map(select(test("^Pods") | not)) | .[0]')
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
      # -sdk iphoneos targets real devices (not the Simulator) - see the job-level comment above for
      # why signing is disabled entirely rather than attempted in any form here.
      - name: Archive unsigned Release build
        working-directory: ./mobile/ios
        run: |
          xcodebuild -workspace "${{ steps.xcode_project.outputs.workspace }}" \
            -scheme "${{ steps.xcode_project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ezbeq-mobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      # Sideloadly/AltStore expect a plain unsigned .ipa (a zipped Payload/ directory containing the
      # .app bundle), not a full .xcarchive - see mobile/docs/ios-sideloading.md Paths B/C.
      - name: Package unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/ezbeq-mobile.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr ezbeq-mobile-ios-unsigned.ipa Payload)
      # Published separately so a Mac can open it directly in Xcode's Organizer and sign/export/
      # install with its own Apple ID - see mobile/docs/ios-sideloading.md Path A.
      - name: Package .xcarchive
        run: (cd "$RUNNER_TEMP" && zip -qr ezbeq-mobile-ios.xcarchive.zip ezbeq-mobile.xcarchive)
      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: ezbeq-mobile-ios-unsigned.ipa
          path: ${{ runner.temp }}/ezbeq-mobile-ios-unsigned.ipa
          retention-days: 1
      - name: Upload .xcarchive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ezbeq-mobile-ios.xcarchive.zip
          path: ${{ runner.temp }}/ezbeq-mobile-ios.xcarchive.zip
          retention-days: 1

  publishmobileios:
    name: Publish iOS build
    needs: [create_release, buildmobileios]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned .ipa artifact
        uses: actions/download-artifact@v4
        with:
          name: ezbeq-mobile-ios-unsigned.ipa
      - name: Download .xcarchive artifact
        uses: actions/download-artifact@v4
        with:
          name: ezbeq-mobile-ios.xcarchive.zip
      # --repo is required here (unlike the other Upload asset steps in this workflow) because this
      # job has no actions/checkout step - gh normally resolves the target repo from the local git
      # remote, which doesn't exist without one.
      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            ezbeq-mobile-ios-unsigned.ipa#ezbeq-mobile-ios-unsigned.ipa \
            ezbeq-mobile-ios.xcarchive.zip#ezbeq-mobile-ios.xcarchive.zip \
            --repo ${{ github.repository }}
