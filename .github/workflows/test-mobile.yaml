name: run mobile tests
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    branches:
      - '**'
defaults:
  run:
    shell: bash
    working-directory: ./mobile
jobs:
  detect-version-bump:
    uses: ./.github/workflows/detect-version-bump.yaml
  detect-changed-paths:
    uses: ./.github/workflows/detect-changed-paths.yaml
  test:
    name: Mobile tests
    needs: [detect-version-bump, detect-changed-paths]
    if: needs.detect-version-bump.outputs.skip != 'true' && needs.detect-changed-paths.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./mobile/coverage/lcov.info
          flags: mobile
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
