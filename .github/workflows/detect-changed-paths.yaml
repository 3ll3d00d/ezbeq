name: Detect changed paths
# Companion to detect-version-bump.yaml: test.yaml/test-ui.yaml/test-mobile.yaml lost their own
# path filters in PR #113 specifically because a path-filtered *required* status check can get
# stuck permanently pending on a PR that never touches that path (GitHub has no way to distinguish
# "legitimately skipped" from "never ran"). This workflow keeps the same fix - the workflow trigger
# itself always fires - but reintroduces the actual point of path filtering (skipping unrelated
# work) at the *job* level instead, via each caller's own `if:`. A job whose `if:` evaluates false
# reports as "skipped", which GitHub branch protection treats as a passing required check - the
# same mechanism the version-bump skip already relies on.
on:
  workflow_call:
    outputs:
      python:
        description: "'true' if this push/PR touches paths that affect the Python test suite"
        value: ${{ jobs.check.outputs.python }}
      ui:
        description: "'true' if this push/PR touches paths that affect the UI test suite"
        value: ${{ jobs.check.outputs.ui }}
      mobile:
        description: "'true' if this push/PR touches paths that affect the mobile test suite"
        value: ${{ jobs.check.outputs.mobile }}
jobs:
  check:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch is a manual "run it for real" request - the whole point would be defeated
      # by silently skipping everything if paths-filter's fallback diff (no natural before/after ref
      # for this event type, unlike push/pull_request) happened to yield zero changes. Forced true
      # unconditionally rather than relying on paths-filter's undocumented workflow_dispatch
      # behavior - the filter step below doesn't even run for this event, see its `if:`.
      python: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.python }}
      ui: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ui }}
      mobile: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.mobile }}
    steps:
      # Only push events need local git history to diff against - pull_request diffs via the
      # GitHub API with no checkout, and workflow_dispatch skips the filter step entirely (see
      # above). fetch-depth: 0 (full history) rather than a shallow depth since a push can carry an
      # arbitrary number of commits (e.g. this very PR pushed several at once).
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'ezbeq/**'
              - 'tests/**'
              - 'bin/smoke-test'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.coveragerc'
              - 'codecov.yml'
              - '.github/workflows/test.yaml'
              - '.github/workflows/detect-version-bump.yaml'
              - '.github/workflows/detect-changed-paths.yaml'
            ui:
              - 'ui/**'
              - 'codecov.yml'
              - '.github/workflows/test-ui.yaml'
              - '.github/workflows/detect-version-bump.yaml'
              - '.github/workflows/detect-changed-paths.yaml'
            mobile:
              - 'mobile/**'
              - 'codecov.yml'
              - '.github/workflows/test-mobile.yaml'
              - '.github/workflows/detect-version-bump.yaml'
              - '.github/workflows/detect-changed-paths.yaml'
