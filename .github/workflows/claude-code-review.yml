name: Claude Code Review

# On-demand only — this used to auto-trigger on every PR event, which made remote
# review a mandatory, blocking step in the merge cycle. Run it manually instead:
#   gh workflow run claude-code-review.yml -f pr_number=<N>
# Local review before commit/push (see AGENTS.md "Before pushing") is the default;
# this remote review is an opt-in extra pair of eyes, not a gate.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Run Claude Code Review
        # Skip silently if no Claude token is configured
        if: env.HAS_CLAUDE_TOKEN == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.inputs.pr_number }}

            Perform a code review with the following focus areas:

            1. **Correctness** — logic bugs, edge cases, error handling
            2. **Security** — injection, unsafe input handling, secrets
            3. **Reuse / Simplification** — unnecessary complexity, duplicated logic

            Provide feedback using inline comments for specific issues.
            Use a single top-level comment for a brief summary, or to say there is
            nothing to flag if the change is trivial or has no issues.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
