name: docker
on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v[0-9]*'
    paths-ignore:
      - README.md
      - docs/**
      - docker/README.md
  workflow_dispatch:
defaults:
  run:
    shell: bash
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  # paths-ignore above applies to the whole `push` trigger, tags included - a `mobile/**` entry
  # there would silently skip publishing for a mobile-only release tag too (create-app.yaml builds
  # the Android app on the same tag scheme). This job-level check instead only skips branch pushes
  # that touch nothing outside mobile/ - tag pushes and workflow_dispatch always proceed regardless.
  # Reuses test.yaml/test-ui.yaml/test-mobile.yaml's shared detect-changed-paths.yaml (its `docker`
  # output) rather than a second, independent dorny/paths-filter config to keep in sync. Only runs
  # for the one case its output is actually consumed (a branch push) - a full-history checkout plus
  # paths-filter for every tag push/workflow_dispatch, whose result build-and-push ignores anyway,
  # would be pure waste and an extra unnecessary point of failure on the release path.
  detect-changed-paths:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/detect-changed-paths.yaml
  build-and-push:
    name: Build and push Docker image
    needs: detect-changed-paths
    # always() because this `if:` would otherwise implicitly AND with success() against `needs:` -
    # without it, a failed *or* deliberately-skipped detect-changed-paths (the latter is normal for
    # every tag push/workflow_dispatch, see its own `if:` above) would silently skip this job even
    # for a tag push, contradicting "tag pushes always proceed" below. `result != 'success'` (not
    # `== 'true'`) is deliberately fail-open: an inconclusive detect-changed-paths (crashed OR
    # legitimately skipped, output empty either way) runs the build rather than silently not
    # publishing a possibly-real release - this isn't a required branch-protection check, so there's
    # no equivalent "skip reports as a passing check" concern to fail closed against.
    # !cancelled() is not covered by that same fail-open reasoning: needs.<job>.result == 'cancelled'
    # also satisfies `!= 'success'`, so without this, someone manually cancelling an in-flight run
    # (e.g. right after pushing a bad commit to main) wouldn't actually stop the image from
    # publishing - always() would still start this job despite the cancellation.
    if: >-
      (always() && !cancelled()) &&
      (github.event_name != 'push' ||
       startsWith(github.ref, 'refs/tags/') ||
       needs.detect-changed-paths.result != 'success' ||
       needs.detect-changed-paths.outputs.docker == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Set up Python so the version-stamping step's `python3 -c "import tomllib"` is
      # guaranteed to find tomllib (stdlib only on 3.11+; the runner's system Python
      # may be older).
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      # Write ezbeq/VERSION so the image reports a meaningful version via
      # /api/1/version. Tag pushes get the released version (e.g. "2.11.9"). Branch
      # and manual-dispatch pushes get a PEP 440 local-version snapshot (e.g.
      # "2.11.9+dev.5341b1d") so nobody mistakes an unreleased build for a release.
      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "${GITHUB_REF_NAME#v}" > ezbeq/VERSION
          else
            BASE=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            BRANCH_CLEAN=$(echo "$GITHUB_REF_NAME" | tr -c '[:alnum:]' '.' | tr -s '.' | sed 's/^\.//; s/\.$//')
            echo "${BASE}+${BRANCH_CLEAN}.${GITHUB_SHA:0:7}" > ezbeq/VERSION
          fi
          echo "VERSION stamped: $(cat ezbeq/VERSION)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
