name: docker
on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v[0-9]*'
    paths-ignore:
      - README.md
      - docs/**
      - docker/README.md
      - mobile/**
  workflow_dispatch:
defaults:
  run:
    shell: bash
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Set up Python so the version-stamping step's `python3 -c "import tomllib"` is
      # guaranteed to find tomllib (stdlib only on 3.11+; the runner's system Python
      # may be older).
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      # Write ezbeq/VERSION so the image reports a meaningful version via
      # /api/1/version. Tag pushes get the released version (e.g. "2.11.9"). Branch
      # and manual-dispatch pushes get a PEP 440 local-version snapshot (e.g.
      # "2.11.9+dev.5341b1d") so nobody mistakes an unreleased build for a release.
      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "${GITHUB_REF_NAME#v}" > ezbeq/VERSION
          else
            BASE=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            BRANCH_CLEAN=$(echo "$GITHUB_REF_NAME" | tr -c '[:alnum:]' '.' | tr -s '.' | sed 's/^\.//; s/\.$//')
            echo "${BASE}+${BRANCH_CLEAN}.${GITHUB_SHA:0:7}" > ezbeq/VERSION
          fi
          echo "VERSION stamped: $(cat ezbeq/VERSION)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
