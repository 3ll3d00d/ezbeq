name: run ui tests
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    branches:
      - '**'
defaults:
  run:
    shell: bash
    working-directory: ./ui
jobs:
  detect-version-bump:
    uses: ./.github/workflows/detect-version-bump.yaml
  detect-changed-paths:
    uses: ./.github/workflows/detect-changed-paths.yaml
  test-run:
    name: UI test run
    needs: [detect-version-bump, detect-changed-paths]
    if: needs.detect-version-bump.outputs.skip != 'true' && needs.detect-changed-paths.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use node.js lts
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Setup node_modules
        run: yarn install --immutable
      - name: Unit tests
        run: yarn test:unit --run --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./ui/coverage/lcov.info
          flags: ui
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Build
        run: yarn build
  # This job, not test-run, is the one named "UI tests" and required by branch protection - see
  # test.yaml's "Required checks" job for why. If test-run's `if:` were the only gate, a crashed
  # detect-version-bump/detect-changed-paths (empty outputs, not just false ones) would make
  # GitHub auto-skip test-run via its default "needs jobs must succeed" behavior, and a skipped
  # required check reports as passing - silently masking a real CI infra failure as a green check.
  test:
    name: UI tests
    runs-on: ubuntu-latest
    needs: [detect-version-bump, detect-changed-paths, test-run]
    if: always()
    # statuses:read lets the coverage-gate step below poll Codecov's commit status via the API.
    permissions:
      statuses: read
    steps:
      # Overrides the workflow-level `defaults.run.working-directory: ./ui` - this job never checks
      # out the repo (it only inspects other jobs' needs context), so that directory doesn't exist
      # on the runner and bash fails to even start without this override.
      - name: Check test result
        working-directory: .
        run: |
          if [[ "${{ needs.detect-version-bump.result }}" != "success" ]]; then
            echo "detect-version-bump job did not succeed: ${{ needs.detect-version-bump.result }}"
            exit 1
          fi
          if [[ "${{ needs.detect-changed-paths.result }}" != "success" ]]; then
            echo "detect-changed-paths job did not succeed: ${{ needs.detect-changed-paths.result }}"
            exit 1
          fi
          if [[ "${{ needs.detect-version-bump.outputs.skip }}" == "true" ]]; then
            echo "Skipping: version-only bump commit"
            exit 0
          fi
          if [[ "${{ needs.detect-changed-paths.outputs.ui }}" != "true" ]]; then
            echo "Skipping: no ui-relevant changes"
            exit 0
          fi
          if [[ "${{ needs.test-run.result }}" != "success" ]]; then
            echo "test-run job did not succeed: ${{ needs.test-run.result }}"
            exit 1
          fi
      - name: Wait for Codecov coverage-regression result
        # See test.yaml's "Required checks" job for why this lives here instead of requiring the
        # raw `codecov/project/ui` status context directly in branch protection.
        if: needs.detect-version-bump.outputs.skip != 'true' && needs.detect-changed-paths.outputs.ui == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          context="codecov/project/ui"
          deadline=$((SECONDS + 900))
          state=""
          while (( SECONDS < deadline )); do
            state=$(gh api "repos/${{ github.repository }}/commits/${sha}/status" \
              --jq ".statuses[] | select(.context==\"${context}\") | .state" 2>/dev/null | head -1)
            echo "t+${SECONDS}s: ${context} = ${state:-<not posted yet>}"
            case "$state" in
              success) break ;;
              error|failure) echo "Codecov reported '${state}' for ${context}"; exit 1 ;;
            esac
            sleep 30
          done
          if [[ "$state" != "success" ]]; then
            echo "Timed out after 900s waiting for ${context} - Codecov never reported a result"
            exit 1
          fi
